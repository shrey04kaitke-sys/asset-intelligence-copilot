[project]
name = "asset-intelligence-copilot"
version = "0.1.0"
description = "Evidence-grounded decision-support copilot for oil-well asset data"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "google-genai>=2.31,<3",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a live model provider (skipped unless configured)", "realstore: touches the real OS credential store with synthetic values", "e2e: drives the real UI in a real browser (scripted model)"]

[tool.setuptools.packages.find]
include = ["copilot*"]
